<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfer Fork</title>
    <meta name="theme-color" content="#FAFAFE">
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/assets/style.css">
</head>

<body>
    <header>
        <h1>Transfer Fork</h1>
        <p>Share files over your local network</p>
    </header>

    <main>
        <section id="upload-section">
            <div id="section-header-with-button" class="header-container">
                <h2>Upload Files</h2>
                <button id="paste-button" class="icon-button" title="Paste from Clipboard">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" fill="currentColor">
                        <path d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h167q11-35 43-57.5t70-22.5q40 0 71.5 22.5T594-840h166q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h560v-560h-80v80q0 17-11.5 28.5T640-640H320q-17 0-28.5-11.5T280-680v-80h-80v560Zm308.5-571.5Q520-783 520-800t-11.5-28.5Q497-840 480-840t-28.5 11.5Q440-817 440-800t11.5 28.5Q463-760 480-760t28.5-11.5Z" />
                    </svg>
                </button>
            </div>
            <div id="drop-zone">
                <p>Drag & drop files here or click to select</p>
                <input type="file" id="file-input" multiple>
            </div>
            <div id="upload-progress-container">
                <!-- Upload progress items will be dynamically added here -->
            </div>
        </section>

        <section id="files-section">
            <div id="files-header-container" class="header-container">
                <h2>Available Files</h2>
                <div id="files-actions">
                    <button id="download-all-zip-button" style="display: none;">Download All as Zip</button>
                </div>
            </div>


            <div class="table-container">
                <table id="files-table">
                    <thead>
                        <tr>
                            <th><input type="checkbox" id="select-all-checkbox"></th>
                            <th>Name</th>
                            <th>Size</th>
                            <th>Last Modified</th>
                            <th>Type</th>
                            <th>Actions</th> <!-- Re-added Actions header -->
                        </tr>
                    </thead>
                    <tbody>
                        <!-- File rows will be dynamically added here -->
                    </tbody>
                </table>
            </div>
            <p id="no-files-message" style="display:none;">No files found in the shared folder.</p>
        </section>
    </main>

    <footer>
        <p>Transfer Fork · fork of <a href="https://github.com/matan-h/Transfer" target="_blank" rel="noopener">matan-h/Transfer</a></p>
    </footer>

    <!-- Custom Confirmation Modal HTML -->
    <div id="confirmation-modal-overlay" class="modal-overlay">
        <div class="modal-content">
            <p id="confirmation-modal-message"></p>
            <div class="modal-checkbox-container">
                <input type="checkbox" id="do-not-ask-again">
                <label for="do-not-ask-again">Don't ask me again</label>
            </div>
            <div class="modal-buttons">
                <button id="modal-confirm-button" class="delete-button">Delete</button>
                <button id="modal-cancel-button">Cancel</button>
            </div>
        </div>
    </div>

    <script src="/assets/script.js"></script>

</body>

</html>
