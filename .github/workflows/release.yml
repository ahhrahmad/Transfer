name: Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Check Maven Central
        run: |
          curl -sS -o /dev/null -w 'maven central: %{http_code}\n' https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/2.0.20/kotlin-stdlib-2.0.20.pom
          getent hosts repo.maven.apache.org | head -2

      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;30.0.16248370" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: transfer-core

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Decrypt keystore
        env:
          GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}
        run: |
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSWORD" \
              -o app/keystore/transfer-key.jks \
              -d app/keystore/transfer-key.jks.gpg

      - name: Build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --refresh-dependencies

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: transfer-fork-release-apk
          path: app/build/outputs/apk/release/app-release.apk
